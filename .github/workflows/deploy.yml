name: Deploy

# Deploys ONLY the nearer Compose project to /regiuslab/nearer on APP_PORT 3011.
# Never runs docker compose against other projects, never prune, never compose down.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nearer-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_PROJECT_NAME: nearer
  DEPLOY_PATH: /regiuslab/nearer
  APP_PORT: "3011"

defaults:
  run:
    shell: bash

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare image names
        run: |
          echo "FRONTEND_IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "LINK_PREVIEW_IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/link-preview:${GITHUB_SHA}" >> "$GITHUB_ENV"
          printf 'DOMAIN=nearer.example.com\nACME_EMAIL=\nAPP_PORT=3011\n' > .env
          docker compose config --quiet

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nearer images only
        run: |
          docker compose build --builder default --pull
          docker compose push

      - name: Export image tags
        id: images
        run: |
          echo "frontend=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "link_preview=${LINK_PREVIEW_IMAGE}" >> "$GITHUB_OUTPUT"

    outputs:
      frontend: ${{ steps.images.outputs.frontend }}
      link_preview: ${{ steps.images.outputs.link_preview }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # Map secrets to env — `if:` cannot reference `secrets` directly.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      NEARER_SSH_KEY: ${{ secrets.NEARER_SSH_KEY }}
      NEARER_SSH_HOST: ${{ secrets.NEARER_SSH_HOST }}
      NEARER_SSH_USER: ${{ secrets.NEARER_SSH_USER }}
    steps:
      - name: Checkout deploy helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/server-deploy.sh
            docker-compose.yml
            .env.example
            deploy/caddy.nearer.snippet
          sparse-checkout-cone-mode: false

      - name: Check deploy secrets
        run: |
          set -euo pipefail
          # Secrets must live on Environment "production" (this job uses it) or as repo secrets.
          missing=0
          if [[ -z "${TS_AUTHKEY}" && ( -z "${TS_OAUTH_SECRET}" || -z "${TS_OAUTH_CLIENT_ID}" ) ]]; then
            echo "::error::Tailscale auth missing (TS_AUTHKEY or TS_OAUTH_CLIENT_ID+TS_OAUTH_SECRET)."
            missing=1
          fi
          for name in NEARER_SSH_KEY NEARER_SSH_HOST NEARER_SSH_USER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is empty or unset."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add secrets under GitHub → Settings → Environments → production → Environment secrets"
            echo "Required SSH: NEARER_SSH_HOST=100.94.144.13 NEARER_SSH_USER=regius NEARER_SSH_KEY=<deploy private key>"
            exit 1
          fi
          if [[ -n "${TS_AUTHKEY}" ]]; then
            echo "Using TS_AUTHKEY"
          else
            echo "Using Tailscale OAuth client"
          fi
          echo "SSH target ${NEARER_SSH_USER}@${NEARER_SSH_HOST}"

      - name: Connect Tailscale (auth key)
        if: ${{ env.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ env.TS_AUTHKEY }}
          targets: 100.94.144.13

      - name: Connect Tailscale (OAuth)
        if: ${{ env.TS_AUTHKEY == '' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          targets: 100.94.144.13

      - name: Deploy nearer over SSH
        env:
          SSH_KEY: ${{ env.NEARER_SSH_KEY }}
          SSH_HOST: ${{ env.NEARER_SSH_HOST }}
          SSH_USER: ${{ env.NEARER_SSH_USER }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend }}
          LINK_PREVIEW_IMAGE: ${{ needs.build-and-push.outputs.link_preview }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/nearer_deploy
          chmod 600 ~/.ssh/nearer_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/nearer_deploy -o IdentitiesOnly=yes "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_PATH}' && test -w '${DEPLOY_PATH}'"

          # Copy only nearer deploy helpers — no --delete (must not wipe /regiuslab/nearer).
          rsync -az \
            -e "ssh -i ~/.ssh/nearer_deploy -o IdentitiesOnly=yes" \
            ./docker-compose.yml \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.yml"
          rsync -az \
            -e "ssh -i ~/.ssh/nearer_deploy -o IdentitiesOnly=yes" \
            ./scripts/server-deploy.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/scripts/"
          rsync -az \
            -e "ssh -i ~/.ssh/nearer_deploy -o IdentitiesOnly=yes" \
            ./deploy/caddy.nearer.snippet \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/deploy/"

          # Refresh image pins and port only — never overwrite a custom DOMAIN if present.
          ssh -i ~/.ssh/nearer_deploy -o IdentitiesOnly=yes "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
          set -euo pipefail
          cd '${DEPLOY_PATH}'
          if [[ ! -f .env ]]; then
            printf 'DOMAIN=nearer.example.com\nACME_EMAIL=\nAPP_PORT=3011\n' > .env
          fi
          grep -q '^APP_PORT=' .env && sed -i 's/^APP_PORT=.*/APP_PORT=3011/' .env || echo 'APP_PORT=3011' >> .env
          grep -q '^FRONTEND_IMAGE=' .env && sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env || echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env
          grep -q '^LINK_PREVIEW_IMAGE=' .env && sed -i "s|^LINK_PREVIEW_IMAGE=.*|LINK_PREVIEW_IMAGE=${LINK_PREVIEW_IMAGE}|" .env || echo "LINK_PREVIEW_IMAGE=${LINK_PREVIEW_IMAGE}" >> .env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          chmod +x scripts/server-deploy.sh
          DEPLOY_PATH='${DEPLOY_PATH}' COMPOSE_PROJECT_NAME=nearer ./scripts/server-deploy.sh
          EOF
