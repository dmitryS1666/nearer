name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend test & build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build
    runs-on:
      group: build
    needs: [frontend]
    timeout-minutes: 30
    env:
      FRONTEND_IMAGE: nearer-frontend:ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Docker Compose configuration
        run: docker compose --env-file /dev/null config --quiet
      # ponytail: use the daemon builder; restore docker-container only on compatible runner kernels/runtimes.
      - name: Build Docker images
        run: docker compose --env-file /dev/null build --builder default --pull
