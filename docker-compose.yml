services:
  link-preview:
    image: ${LINK_PREVIEW_IMAGE:-nearer-link-preview:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PAIR_STORE: /data/pairs.json
      PLUS_INTENT_STORE: /data/plus-intents.json
      PLUS_NOTIFY_TO: ${PLUS_NOTIFY_TO:-dsuschinsky@gmail.com}
      PLUS_MAIL_MODE: ${PLUS_MAIL_MODE:-}
      PLUS_MAIL_FROM: ${PLUS_MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
    volumes:
      - pair-data:/data
    expose:
      - "8787"
    networks:
      - tish

  frontend:
    image: ${FRONTEND_IMAGE:-nearer-frontend:local}
    build:
      context: .
    restart: unless-stopped
    ports:
      # Default 3011 on regiuslab-de (3007 is used by another stack).
      - "${APP_PORT:-3011}:80"
    depends_on:
      link-preview:
        condition: service_healthy
    networks:
      - tish

